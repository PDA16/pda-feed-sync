name: Sync Salty Crush feed
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download feed from Impact FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          mkdir -p feed
          curl -sS --fail --connect-timeout 60 \
            --user "$FTP_USER:$FTP_PASS" \
            "ftp://products.impact.com/Salty-Crush/AU-GMC-All-Products_GOOGLE.xml.gz" \
            -o feed/au.xml.gz
          gunzip -f feed/au.xml.gz
          echo "Products: $(grep -c '<item>' feed/au.xml)"
      - name: Publish feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed/au.xml
          git diff --staged --quiet || git commit -m "Update feed $(date -u +%F)"
          git push
